<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي المتكامل الاحترافي</title>
  <style>
    :root {
      --color-deep-forest: #00473c;
      --color-lime-glow: #e6ff55;
      --color-cream-canvas: #f4f3e7;
      --color-forest-shadow: #0e150e;
    }
    body {
      background-color: var(--color-cream-canvas);
      color: var(--color-forest-shadow);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid rgba(14, 21, 14, 0.1);
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: var(--color-deep-forest);
      font-weight: 700;
    }
    .hero {
      padding: 80px 20px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }
    .hero h1 {
      font-size: 56px;
      line-height: 1.1;
      color: var(--color-deep-forest);
      margin-bottom: 20px;
    }
    .btn-main {
      background-color: var(--color-lime-glow);
      color: var(--color-forest-shadow);
      padding: 16px 32px;
      border-radius: 9999px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      box-shadow: 3px 3px 20px rgba(14,21,14,0.15);
    }
  </style>
</head>
<body>

  <!-- شريط التنقل العلوي -->
  <header>
    <div style="font-weight: 900; font-size: 24px; color: var(--color-deep-forest);">AZEDDIN.DEV</div>
    <nav>
      <a href="#home">الرئيسية</a>
      <a href="#projects">المشاريع</a>
      <a href="#articles">المقالات</a>
      <a href="#contact">تواصل معي</a>
    </nav>
  </header>

  <!-- القسم الرئيسي البارز -->
  <section class="hero" id="home">
    <h1>مرحباً، أنا عزالدين بوعبسة</h1>
    <p style="font-size: 18px; margin-bottom: 30px; line-height: 1.6;">مطور ومختص أجمع بين هندسة البرمجيات وخلفيتي الأكاديمية في القانون الخاص. أصمم وأطور تجارب ويب متقدمة ونظيفة.</p>
    <a href="#projects" class="btn-main">استعرض مشاريعي</a>
  </section>

</body>
</html>
